services:
  db:
    image: postgres:16-alpine
    container_name: sakura-db
    environment:
      POSTGRES_DB: sakura_style
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - sakura_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sakura_style"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sakura-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sakura_style
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    container_name: sakura-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sakura_pg_data:
